name: Bug report
description: Report a reproducible problem with the checklist.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, and app version
  - type: textarea
    id: details
    attributes:
      label: Extra context
      description: Do not attach personal backups or sensitive information.
