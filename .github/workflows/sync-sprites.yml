name: Sync Sprites
# Preserve the established Friday 02:00 UTC schedule; changes require review.
on:
  schedule:
    - cron: "0 2 * * 5"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sync-sprites
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: pip install -r scripts/requirements.txt
      - run: python3 scripts/sync_sprites.py
      - run: npm ci
      - run: npm test && npm run build
      - name: Open or update roster pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add src/data/treasure-hunters.json public/sprites
          if git diff --cached --quiet; then exit 0; fi
          git switch -C automation/sync-sprites
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/treasure-hunters.json public/sprites
          git commit -m 'Update Treasure Hunters roster and artwork'
          REMOTE_SHA="$(git ls-remote --heads origin refs/heads/automation/sync-sprites | cut -f1)"
          git push --force-with-lease="refs/heads/automation/sync-sprites:$REMOTE_SHA" origin automation/sync-sprites
          if ! gh pr list --head automation/sync-sprites --json number --jq '.[].number' | grep -q .; then
            gh pr create --base main --head automation/sync-sprites --title 'Update Treasure Hunters roster and artwork' --body 'Validated against Sprite Catch. Tests and production build passed. Review roster and art changes before merging. AI assistance: none in this automated sync.'
          fi
