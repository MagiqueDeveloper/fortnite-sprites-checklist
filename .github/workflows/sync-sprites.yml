name: Sync Sprites

# Every Friday at 02:00 UTC, and on demand.
# Checks spritechecklist.org + IGN for new/updated Season 4 Sprites, commits
# to main, then builds and deploys Pages in this same workflow (a GITHUB_TOKEN
# push would not re-trigger deploy.yml).
on:
  schedule:
    - cron: "0 2 * * 5"
  workflow_dispatch:
    inputs:
      update_abilities:
        description: "Overwrite local ability text from upstream"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-sprites
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install sync dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync roster and art
        id: sync
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "${{ github.event.inputs.update_abilities }}" = "true" ]; then
            EXTRA="--update-abilities"
          fi
          python3 scripts/sync_sprites.py $EXTRA | tee /tmp/sync-out.txt
          if grep -q 'CHANGED=1' /tmp/sync-out.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install, type-check and build
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sprites.ts public/sprites README.md
          if git diff --cached --quiet; then
            echo "No staged changes after sync"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          Sync Sprites from spritechecklist.org and IGN

          Weekly Friday 02:00 UTC check for new and updated Chapter 7 Season 4
          Sprite families, variants, and art.
          EOF
          )"
          git push origin HEAD:main

      - name: Configure Pages
        if: steps.sync.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5